<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gezinsapp">
<meta name="theme-color" content="#FAFEF9">
<title>Gezinsapp — Kinderlogistiek</title>
<link rel="stylesheet" href="style.css">
<style>
/* ── Week dag rijen ────────────────────────────────────────── */
.kl-dag-rij{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:6px;}
.kl-dag-rij.vandaag{border-color:var(--accent);}
.kl-dag-rij.weekend{opacity:.6;}
.kl-dag-header{display:flex;align-items:center;gap:8px;padding:11px 14px;cursor:pointer;user-select:none;}
.kl-dag-naam{font-weight:700;font-size:15px;color:var(--ink);min-width:26px;}
.kl-dag-datum{font-size:13px;color:var(--muted);}
.kl-dag-badges{display:flex;gap:4px;flex:1;flex-wrap:wrap;align-items:center;}
.kl-dag-chevron{color:var(--muted);font-size:13px;margin-left:auto;flex-shrink:0;}
.kl-dag-body{display:none;border-top:1px solid var(--border);padding:12px 14px;}
.kl-dag-body.open{display:block;}

/* ── Kind sectie in dag body ───────────────────────────────── */
.kl-kind-sectie{margin-bottom:14px;}
.kl-kind-sectie:last-child{margin-bottom:0;}
.kl-kind-titel{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.kl-transport-rij{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:6px;}
.kl-transport-veld label{font-size:11px;color:var(--muted);font-weight:600;display:block;margin-bottom:3px;}
.kl-transport-veld select{width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:13px;background:var(--bg);color:var(--ink);cursor:pointer;font-family:inherit;}
.kl-transport-veld select.override{border-color:var(--accent);background:var(--accent-l);color:var(--accent);font-weight:600;}
.kl-eetgroo{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;cursor:pointer;padding:4px 0;color:var(--ink);}
.kl-act-badge{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--bg-2);color:var(--muted);border:1px solid var(--border);}
.kl-vakantie-badge{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--normaal-bg);color:var(--normaal-clr);font-weight:600;}
.kl-reset-btn{font-size:11px;color:var(--accent);background:none;border:none;cursor:pointer;padding:0;margin-left:auto;}

/* ── Activiteiten per kind ─────────────────────────────────── */
.kl-acts-wrap{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;}
.kl-act-rij{display:flex;align-items:center;gap:6px;justify-content:space-between;}
.kl-act-info{display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex:1;}
.kl-act-transport{font-size:11px;color:var(--accent);font-weight:600;}
.kl-edit-btn{font-size:13px;background:none;border:none;cursor:pointer;padding:2px 4px;border-radius:var(--radius-sm);flex-shrink:0;}
.kl-edit-btn:hover{background:var(--bg-2);}

/* ── Activity transport modal ──────────────────────────────── */
.kl-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
.kl-modal-overlay.hidden{display:none;}
.kl-modal{background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;padding:20px;width:100%;max-width:480px;box-shadow:0 -4px 24px rgba(0,0,0,.15);}
.kl-modal-titel{font-weight:700;font-size:16px;color:var(--ink);margin-bottom:4px;}
.kl-modal-sub{font-size:12px;color:var(--muted);margin-bottom:16px;}
.kl-modal-rij{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.kl-modal-veld label{font-size:11px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px;}
.kl-modal-veld select{width:100%;padding:9px 10px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:13px;background:var(--bg);color:var(--ink);font-family:inherit;}
.kl-modal-acties{display:flex;gap:8px;justify-content:flex-end;margin-top:4px;}
.kl-modal-acties button{padding:9px 18px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;cursor:pointer;border:none;}
.btn-annuleer{background:var(--bg-2);color:var(--ink);}
.btn-opslaan{background:var(--accent);color:#fff;}

/* ── Standaard weekrooster ─────────────────────────────────── */
.kl-rooster-header{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:2px 0;}
.kl-rooster-titel{font-weight:700;font-size:15px;color:var(--ink);}
.kl-rooster-chevron{color:var(--muted);font-size:13px;}
.kl-std-kind{margin-bottom:1rem;}
.kl-std-kind:last-child{margin-bottom:0;}
.kl-std-kind-naam{font-size:12px;font-weight:700;color:var(--ink);margin-bottom:8px;padding-bottom:5px;border-bottom:1.5px solid var(--border);display:flex;align-items:center;gap:5px;}
.kl-std-rij{display:grid;grid-template-columns:32px 1fr 1fr;gap:6px;align-items:center;margin-bottom:6px;}
.kl-std-dag{font-size:12px;font-weight:600;color:var(--muted);}
.kl-std-select{font-size:12px;padding:6px 8px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--ink);font-family:inherit;width:100%;cursor:pointer;}
.kl-std-select.ingevuld{border-color:var(--accent);color:var(--accent);font-weight:600;}
.kl-std-eetgroo{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);cursor:pointer;padding:2px 0;margin-top:-2px;}
.kl-std-eetgroo-rij{grid-column:2/-1;}

@media(min-width:600px){
  .kl-std-rij{grid-template-columns:48px 1fr 1fr;}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-title"><i data-lucide="baby" class="icon-inline"></i> Kinderlogistiek</div>
  <div class="topbar-actions">
    <span class="opslag-status" id="opslag-status"></span>
    <div class="topbar-user-wrap">
      <div class="topbar-user" id="topbar-user" data-action="toggle-profiel-menu">
        <span class="avatar" id="topbar-emoji">🧑</span>
        <span class="naam" id="topbar-naam">…</span>
      </div>
      <div class="profiel-menu" id="profiel-menu">
        <a href="instellingen.html" class="profiel-menu-item"><i data-lucide="settings" class="icon-inline"></i>&nbsp; Instellingen</a>
      </div>
    </div>
  </div>
</header>

<script src="nav.js"></script>
<main class="main-content">
<div class="page-content">

  <div class="page-header">
    <div class="week-nav-row" style="margin-bottom:0;">
      <button class="nav-btn" data-action="change-week" data-dir="-1">&#8592;</button>
      <span class="week-lbl" id="week-lbl-kl"></span>
      <button class="nav-btn" data-action="change-week" data-dir="1">&#8594;</button>
    </div>
  </div>

  <!-- Kind filter -->
  <select class="mob-filter-sel" id="kl-sel-mob"></select>
  <div class="filter-tabs mob-hide-on-mobile" id="kl-filter-tabs" style="margin-bottom:1rem;">
    <button class="filter-tab active" data-action="set-kind-filter" data-filter="alle"><i data-lucide="users" class="icon-inline"></i> Alle</button>
  </div>

  <!-- Standaard weekrooster -->
  <div class="card" style="margin-bottom:1rem;">
    <div class="kl-rooster-header" data-action="toggle-standaard-rooster">
      <span class="kl-rooster-titel"><i data-lucide="settings" class="icon-inline"></i> Standaard weekrooster</span>
      <span class="kl-rooster-chevron" id="standaard-chevron">›</span>
    </div>
    <div id="standaard-rooster-body" style="display:none;margin-top:12px;">
      <div id="standaard-rooster-inhoud"></div>
    </div>
  </div>

  <div id="kl-grid"></div>

</div>
</main>

<!-- Activity transport modal -->
<div class="kl-modal-overlay hidden" id="kl-act-modal">
  <div class="kl-modal">
    <div class="kl-modal-titel" id="kl-modal-titel">Activiteit</div>
    <div class="kl-modal-sub" id="kl-modal-sub"></div>
    <div class="kl-modal-rij">
      <div class="kl-modal-veld">
        <label><i data-lucide="car" class="icon-inline"></i>→ Wie brengt?</label>
        <select id="kl-modal-brengt"></select>
      </div>
      <div class="kl-modal-veld">
        <label>←<i data-lucide="car" class="icon-inline"></i> Wie haalt?</label>
        <select id="kl-modal-haalt"></select>
      </div>
    </div>
    <div class="kl-modal-acties">
      <button class="btn-annuleer" data-action="sluit-act-modal">Annuleren</button>
      <button class="btn-opslaan" data-action="sla-act-transport-op">Opslaan</button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="auth.js"></script>
<script src="state.js"></script>
<script src="data.js"></script>
<script src="kinderlogistiek.js"></script>
</body>
</html>
