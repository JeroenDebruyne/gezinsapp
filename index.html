<script>
function openActDetail(id){
  const a=activiteiten.find(x=>x.id==id);
  if(!a)return;
  const emoji=a.wie?.length===1?(PEMOJI[a.wie[0]]||'📌'):'👨‍👩‍👧‍👦';
  const wieHtml=(a.wie||[]).map(w=>`<span class="badge ${PBADGE[w]||''}">${PLABEL[w]||w}</span>`).join(' ');
  const freq={wekelijks:'Wekelijks',tweewekelijks:'Tweewekelijks',eenmalig:'Eenmalig',maandelijks:'Maandelijks'};
  document.getElementById('act-detail-inhoud').innerHTML=`
    <div style="display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;color:var(--ink);padding-bottom:12px;margin-bottom:14px;border-bottom:1px solid var(--border);">
      <span style="font-size:26px;">${emoji}</span><span>${a.naam}${a.prive?' 🔒':''}</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px;font-size:14px;color:var(--ink-2);">
      ${a.start?`<div>🕐 <strong>${a.start}${a.eindUur?' – '+a.eindUur:''}</strong></div>`:''}
      ${a.locatie?`<div>📍 ${a.locatie}</div>`:''}
      ${a.wie?.length?`<div>👤 ${wieHtml}</div>`:''}
      ${a.freq&&a.freq!=='eenmalig'?`<div>🔄 ${freq[a.freq]||a.freq}</div>`:''}
      ${a.beginDatum?`<div>📅 ${a.beginDatum}${a.eindDatum&&a.eindDatum!==a.beginDatum?' – '+a.eindDatum:''}</div>`:''}
      ${a.informatief?`<span class="badge" style="background:var(--bg-2);color:var(--muted);">📌 Informatief</span>`:''}
    </div>`;
  document.getElementById('act-detail-agenda-btn').onclick=()=>location.href=`agenda.html?datum=${_hNuISO()}`;
  document.getElementById('act-detail-bg').classList.add('open');
}
function sluitActDetail(e){
  if(!e||e.target===document.getElementById('act-detail-bg'))
    document.getElementById('act-detail-bg').classList.remove('open');
}
</script>

function renderHomepage(){
  const nu=new Date(); const datumISO=fDateISO(nu); const p=Auth.profiel();
  localStorage.setItem('gezinsapp_vandaag',datumISO); // gedeeld met agent-pagina
  const dagNamen=['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];
  const maandNamen=['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
  document.getElementById('dag-datum').textContent=
    dagNamen[nu.getDay()].charAt(0).toUpperCase()+dagNamen[nu.getDay()].slice(1)+
    ' '+nu.getDate()+' '+maandNamen[nu.getMonth()]+' '+nu.getFullYear();

// ── Verjaardagsalerts homepage ────────────────────────────────
function _vhParseObj(v){ if(!v) return null; if(typeof v==='string'){ try{ return JSON.parse(v); }catch{ return null; } } return v; }
function _vhDagen(datumStr,herhalend){
  if(!datumStr) return null;
  const nu=new Date(); nu.setHours(0,0,0,0);
  const d=new Date(datumStr+'T12:00:00');
  if(!herhalend) return Math.round((d-nu)/86400000);
  let jaar=nu.getFullYear();
  let vl=new Date(jaar,d.getMonth(),d.getDate());
  if(vl<nu) vl=new Date(jaar+1,d.getMonth(),d.getDate());
  return Math.round((vl-nu)/86400000);
}
function renderVerjaardagHome(){
  const el=document.getElementById('verjaardag-home');
  if(!el) return;
  const VENSTER=7;
  const items=[];
  // Gezinsleden
  (Auth.getProfielen()||[]).forEach(p=>{
    if(!p.geboortedatum) return;
    const d=_vhDagen(p.geboortedatum,true);
    if(d!==null&&d>=0&&d<=VENSTER)
      items.push({label:`🎂 ${p.naam}`,dagen:d,datum:p.geboortedatum});
  });
  // Contacten
  contacten.forEach(c=>{
    const nm=c.naam||'Contact';
    [_vhParseObj(c.partner1),_vhParseObj(c.partner2)].filter(Boolean).forEach(p=>{
      if(!p.verjaardag) return;
      const pnm=((p.voornaam||'')+' '+(p.achternaam||'')).trim()||nm;
      const d=_vhDagen(p.verjaardag,true);
      if(d!==null&&d>=0&&d<=VENSTER) items.push({label:`🎂 ${pnm}`,dagen:d,datum:p.verjaardag});
    });
    (_vhParseObj(c.kinderenData)||[]).forEach(k=>{
      if(!k.verjaardag) return;
      const kn=((k.voornaam||'')+' '+(k.achternaam||'')).trim()||'Kind';
      const d=_vhDagen(k.verjaardag,true);
      if(d!==null&&d>=0&&d<=VENSTER) items.push({label:`🎂 ${kn}`,dagen:d,datum:k.verjaardag});
    });
    (c.belangrijkeDatums||[]).forEach(bd=>{
      if(!bd.datum) return;
      const d=_vhDagen(bd.datum,bd.herhalend);
      if(d!==null&&d>=0&&d<=VENSTER) items.push({label:`📅 ${bd.label||'Datum'} — ${nm}`,dagen:d,datum:bd.datum});
    });
  });
  items.sort((a,b)=>a.dagen-b.dagen);
  if(!items.length){ el.innerHTML=''; return; }
  el.innerHTML=items.map(it=>{
    const datObj=new Date(it.datum+'T12:00:00');
    const dagStr=datObj.toLocaleDateString('nl-BE',{day:'numeric',month:'long'});
    const wanneer=it.dagen===0?'🎉 Vandaag!':it.dagen===1?'Morgen':`Over ${it.dagen} dagen`;
    const vandaag=it.dagen===0;
    return `<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;
      background:${vandaag?'var(--normaal-bg)':'var(--surface-2)'};
      border:1.5px solid ${vandaag?'var(--normaal-dot)':'var(--border)'};
      border-radius:var(--radius-sm);margin-bottom:6px;">
      <div style="flex:1;font-size:14px;font-weight:${vandaag?700:500};color:var(--ink);">${escHtml(it.label)}</div>
      <div style="text-align:right;flex-shrink:0;">
        <div style="font-size:13px;font-weight:600;color:${vandaag?'var(--normaal-clr)':'var(--accent)'};">${wanneer}</div>
        <div style="font-size:11px;color:var(--muted);">${dagStr}</div>
      </div>
    </div>`;
  }).join('');
}

function renderPersoonStrip(p){
  const huidig=sessionStorage.getItem('perspectief')||p?.persoonKey;
  document.getElementById('persoon-strip').innerHTML=Auth.PROFIELEN.map(pr=>`
    <div class="avatar-chip${pr.persoonKey===huidig?' active':''}" onclick="wisselPersoon('${pr.persoonKey}')">
      <span>${pr.emoji}</span><span>${pr.naam}</span>
    </div>`).join('');
}

function wisselPersoon(key){sessionStorage.setItem('perspectief',key);renderHomepage();}

function renderVandaag(datumISO,p){
  const el=document.getElementById('vandaag-lijst');
  const perspectief=sessionStorage.getItem('perspectief')||p?.persoonKey;
  const dagActs=activiteiten.filter(a=>{
    if(!isActiefOpDatum(a,datumISO)) return false;
    if(a.prive&&!Auth.kan('kanAllesZien')&&!a.wie?.includes(perspectief)) return false;
    if(perspectief) return !a.wie||a.wie.includes(perspectief)||a.wie.includes('familie');
    return true;
  }).sort((a,b)=>tijdMinuten(a.start)-tijdMinuten(b.start));
  if(!dagActs.length){el.innerHTML='<div class="empty-state"><div class="empty-icon">🌿</div><p>Geen activiteiten vandaag</p></div>';return;}
  el.innerHTML=dagActs.map(a=>`
    <div class="card" style="display:flex;align-items:center;gap:12px;cursor:pointer;" onclick="openActDetail(${a.id})">
      <div style="font-size:22px;">${a.wie?.length===1?(PEMOJI[a.wie[0]]||'📌'):'👨‍👩‍👧‍👦'}</div>
      <div style="flex:1;">
        <div class="card-title">${a.informatief?'📌 ':''}${a.naam}${a.prive?' 🔒':''}</div>
        <div class="meta">
          ${a.start?`<span>🕐 ${a.start}${a.eindUur?' – '+a.eindUur:''}</span>`:''}
          ${a.locatie?`<span>📍 ${a.locatie}</span>`:''}
          ${(a.wie||[]).map(w=>`<span class="badge ${PBADGE[w]||''}">${PLABEL[w]||w}</span>`).join('')}
        </div>
      </div>
      <div style="color:var(--muted);font-size:14px;flex-shrink:0;">›</div>
    </div>`).join('');
}

function renderTodosPreview(p){
  const el=document.getElementById('todos-preview');
  const perspectief=sessionStorage.getItem('perspectief')||p?.persoonKey;
  const open=todos.filter(t=>!t.gedaan&&(!t.wie||t.wie.includes(perspectief))).slice(0,5);
  if(!open.length){el.innerHTML='<div class="card" style="color:var(--muted);font-size:13px;text-align:center;padding:1rem;">✅ Geen openstaande to-do\'s</div>';return;}
  el.innerHTML=open.map(t=>`
    <div class="todo-item${t.gedaan?' gedaan':''}">
      <button class="todo-cirkel${t.gedaan?' gedaan':''}${!t.gedaan&&t.prioriteit?' '+t.prioriteit:''}" onclick="toggleTodo('${t.id}')"></button>
      <div class="todo-body" style="cursor:pointer;" onclick="location.href='todos.html'">
        <div class="todo-titel${t.gedaan?' gedaan':''}">${t.titel}</div>
        <div class="todo-meta">
          ${t.deadline?`<span>📅 ${t.deadline}</span>`:''}
          ${(t.wie||[]).map(w=>`<span class="badge ${PBADGE[w]||''}">${PLABEL[w]||w}</span>`).join('')}
        </div>
      </div>
    </div>`).join('')+
    '<a href="todos.html" style="display:block;text-align:center;font-size:12px;color:var(--muted);padding:8px;margin-top:4px;">Alle to-do\'s bekijken →</a>';
}

function toggleTodo(id){
  const t=todos.find(x=>x.id==id);
  if(!t)return;
  t.gedaan=!t.gedaan;t.gedaanOp=t.gedaan?fDateISO(new Date()):null;
  slaLokaalOp();sbSaveTodo(t);
  renderTodosPreview(Auth.profiel());
}

// ── Agent op homepage ─────────────────────────────────────────

// ── Datum (leest uit localStorage dat renderHomepage() zojuist heeft gezet)
function _hNuISO(){ return localStorage.getItem('gezinsapp_vandaag')||fDateISO(new Date()); }
function _hGetWeekDates(offset){ return getWeekDatesFrom(_hNuISO(),offset); }
const _hSPEC={shake:'Shake',uiteten:'Uit eten',afhalen:'Afhalen',restjes:'Restjes'};
function _hGetNaam(k){if(!k)return'–';if(_hSPEC[k])return _hSPEC[k];const r=recepten.find(r=>r.id===k||r.id==k);return r?r.naam:'–';}
function _hTransportVoorDag(datum){
  const dagKey=DAGMAP[new Date(datum+'T12:00:00').getDay()];
  const result={};['nora','odiel'].forEach(kind=>{
    const std=(standaardTransport||{})[kind]?.[dagKey]||{};
    const uit=(transportUitzonderingen||{})[datum]?.[kind]||{};
    result[kind]={...std,...uit};
  });return result;
}
function _hVerjDatumDitJaar(vj,nu){
  const[,m,d]=vj.split('-');const dt=new Date(nu.getFullYear(),parseInt(m)-1,parseInt(d));
  if(dt<nu)dt.setFullYear(dt.getFullYear()+1);return dt;
}

// ── Systeemprompt ─────────────────────────────────────────────
function _hSysteemPrompt(){
  const vandaagISO=_hNuISO();
  const dagNaamNL=DLANG_GD[new Date(vandaagISO+'T12:00:00').getDay()];
  let planCtx='';
  try{
    const dates=_hGetWeekDates(0);
    planCtx='\n\nHUIDIGE WEEK:\n'+dates.map((d,i)=>{
      const key=fDateISO(d);const dag=planning[key]||{};
      const acts=activiteiten.filter(a=>isActiefOpDatum(a,key)).map(a=>a.naam+(a.start?' '+a.start:'')).join(', ');
      return '  '+DKORT[i]+' '+key+(key===vandaagISO?' ←VANDAAG':'')+
        ': O='+_hGetNaam(dag.ontbijt)+' L='+_hGetNaam(dag.lunch)+' A='+_hGetNaam(dag.avond)+(acts?' ['+acts+']':'');
    }).join('\n');
  }catch(e){}
  return `Je bent de gezinsassistent.
Vandaag: ${dagNaamNL} ${vandaagISO}.
${bouwGezinsContext()}
Week loopt ma→zo. Op schooldagen (ma-vr) eten kinderen 's middags op school.${planCtx}

REGELS:
- Vraag ALTIJD bevestiging vóór elke schrijfactie (bevestiging_vereist:true).
- Roep get_eethistoriek(8) aan VÓÓR je een weekmenu plant.
- Bij stel_weekmenu_in: gebruik NUMERIEK recept-id uit get_recepten, nooit de naam.
- Antwoord altijd in het Nederlands. Wees bondig en concreet.${geheugen.length ? '\n\nGEHEUGEN (onthouden voorkeuren en feiten):\n' + geheugen.map((g,i) => `${i+1}. ${g.tekst}`).join('\n') : ''}`;
}

  {name:'get_week',description:'Weekoverzicht met per dag activiteiten, maaltijden, transport, drukte.',input_schema:{type:'object',properties:{offset:{type:'integer',description:'0=huidig, 1=volgend, -1=vorig'}},required:[]}},
  {name:'get_activiteiten',description:'Alle activiteiten, optioneel gefilterd op persoon of zoekterm.',input_schema:{type:'object',properties:{persoon:{type:'string'},zoekterm:{type:'string'}},required:[]}},
  {name:'get_recepten',description:'Recepten met filters. Gebruik dit ALTIJD vóór stel_weekmenu_in.',input_schema:{type:'object',properties:{zoekterm:{type:'string'},type:{type:'string',description:'avond/lunch/ontbijt/weekend'},max_tijd:{type:'integer'},tag:{type:'string'},wie:{type:'string'},max_resultaten:{type:'integer'}},required:[]}},

// ── Tool executor ─────────────────────────────────────────────
async function _hExec(naam,input){
  switch(naam){
    case 'get_dag':{
      const datum=input.datum||_hNuISO();
      const dag=planning[datum]||{};const dObj=new Date(datum+'T12:00:00');const dagNr=dObj.getDay();
      const acts=activiteiten.filter(a=>isActiefOpDatum(a,datum)).map(a=>({naam:a.naam,wie:(a.wie||[]).join(','),start:a.start||'',eind:a.eindUur||'',locatie:a.locatie||'',informatief:a.informatief||false}));
      return JSON.stringify({datum,dag:DLANG_GD[dagNr],isVandaag:datum===_hNuISO(),isSchooldag:!isSchoolvakantie(datum)&&dagNr>=1&&dagNr<=5,vakantie:isSchoolvakantie(datum)?getVakantieNaam(datum)||true:false,drukte:getDagDrukte(datum),ontbijt:_hGetNaam(dag.ontbijt),lunch:_hGetNaam(dag.lunch),avond:_hGetNaam(dag.avond),activiteiten:acts,transport:_hTransportVoorDag(datum)});
    }
    case 'get_week':{
      const dates=_hGetWeekDates(input.offset||0);const vandaagISO=_hNuISO();
      return JSON.stringify(dates.map((d,i)=>{const datum=fDateISO(d);const dag=planning[datum]||{};const acts=activiteiten.filter(a=>isActiefOpDatum(a,datum)).map(a=>({naam:a.naam,wie:(a.wie||[]).join(','),start:a.start||'',eind:a.eindUur||''}));return{dag:DKORT[i],datum,isVandaag:datum===vandaagISO,vakantie:isSchoolvakantie(datum)?getVakantieNaam(datum)||true:false,drukte:getDagDrukte(datum),ontbijt:_hGetNaam(dag.ontbijt),lunch:_hGetNaam(dag.lunch),avond:_hGetNaam(dag.avond),activiteiten:acts,transport:_hTransportVoorDag(datum)};}));
    }
    case 'get_activiteiten':{
      let acts=activiteiten;
      if(input.persoon)acts=acts.filter(a=>(a.wie||[]).includes(input.persoon));
      if(input.zoekterm)acts=acts.filter(a=>a.naam.toLowerCase().includes(input.zoekterm.toLowerCase()));
      return JSON.stringify(acts.map(a=>({naam:a.naam,wie:(a.wie||[]).join(','),dagen:(a.dagen||[]).join(','),start:a.start||'',eind:a.eindUur||'',locatie:a.locatie||'',freq:a.freq,beginDatum:a.beginDatum,eindDatum:a.eindDatum})));
    }
    case 'get_recepten':{
      let recs=recepten;
      if(input.zoekterm){const q=input.zoekterm.toLowerCase();recs=recs.filter(r=>r.naam.toLowerCase().includes(q)||(r.tags||[]).some(t=>t.toLowerCase().includes(q)));}
      if(input.type)recs=recs.filter(r=>(r.types||[r.type]).includes(input.type));
      if(input.max_tijd)recs=recs.filter(r=>r.tijd&&r.tijd<=input.max_tijd);
      if(input.tag)recs=recs.filter(r=>(r.tags||[]).includes(input.tag));
      if(input.wie)recs=recs.filter(r=>!r.wie||r.wie===input.wie);
      return JSON.stringify(recs.slice(0,input.max_resultaten||50).map(r=>({id:r.id,naam:r.naam,types:r.types||[r.type],tijd:r.tijd,moeilijk:r.moeilijk,wie:r.wie,score:r.score??null,tags:r.tags||[],ingredienten:(r.ingredienten||[]).map(i=>i.naam)})));
    }
    case 'get_todos':{
      let td=todos;if(!input.inclusief_gedaan)td=td.filter(t=>!t.gedaan);
      if(input.wie)td=td.filter(t=>(t.wie||[]).includes(input.wie));
      if(input.prioriteit)td=td.filter(t=>t.prioriteit===input.prioriteit);
      return JSON.stringify(td.map(t=>({id:t.id,titel:t.titel,notitie:t.notitie||'',deadline:t.deadline||'',prioriteit:t.prioriteit,wie:(t.wie||[]).join(','),gedaan:t.gedaan})));
    }
    case 'get_boodschappenlijst':{
      const res={};WINKELS.forEach(w=>res[w]=[]);
      Object.values(planning).forEach(dag=>['ontbijt','lunch','avond'].forEach(slot=>{const keuze=dag[slot];const numId=Number(keuze);if(keuze&&!isNaN(numId)&&numId>0){const r=recepten.find(r=>r.id==keuze);if(r)(r.ingredienten||[]).forEach(ing=>{const w=ing.winkel||'Andere';if(res[w])res[w].push({naam:ing.naam,hoev:ing.hoev||'',eenheid:ing.eenheid||'',recept:r.naam});});}}));
      (extraItems||[]).forEach(item=>{const w=item.winkel||'Andere';if(res[w])res[w].push({naam:item.naam,hoev:item.hoev||'',eenheid:item.eenheid||'',extra:true});});
      return JSON.stringify(Object.fromEntries(Object.entries(res).filter(([,v])=>v.length)));
    }
    case 'get_contacten':{
      const q=(input.zoekterm||'').toLowerCase();let ct=contacten;if(q)ct=ct.filter(c=>(c.naam||'').toLowerCase().includes(q));
      return JSON.stringify(ct.map(c=>{let partners=[];try{const p=typeof c.partner==='string'?JSON.parse(c.partner):(c.partner||{});partners=Object.values(p).filter(p=>p&&p.voornaam);}catch{}let kinderen=[];try{kinderen=typeof c.kinderen_namen==='string'?JSON.parse(c.kinderen_namen):(c.kinderen_namen||[]);}catch{}return{familie:c.naam,partners:partners.map(p=>({naam:`${p.voornaam||''} ${p.achternaam||''}`.trim(),verjaardag:p.verjaardag||''})),kinderen:kinderen.map(k=>({naam:`${k.voornaam||''} ${k.achternaam||''}`.trim(),verjaardag:k.verjaardag||''})),kerstmis:c.kerstmis||false};}));
    }
    case 'get_verjaardagen':{
      const weken=input.weken||8;const nu=new Date(_hNuISO()+'T00:00:00');const tot=new Date(nu);tot.setDate(tot.getDate()+weken*7);
      const vj=[];contacten.forEach(c=>{let personen=[];try{const p=typeof c.partner==='string'?JSON.parse(c.partner):(c.partner||{});personen.push(...Object.values(p).filter(p=>p&&p.voornaam));}catch{}try{const k=typeof c.kinderen_namen==='string'?JSON.parse(c.kinderen_namen):(c.kinderen_namen||[]);personen.push(...k);}catch{}personen.forEach(p=>{if(!p||!p.verjaardag)return;const d=_hVerjDatumDitJaar(p.verjaardag,nu);if(d>=nu&&d<=tot)vj.push({naam:`${p.voornaam||''} ${p.achternaam||''}`.trim(),familie:c.naam,datum:fDateISO(d),over:Math.round((d-nu)/(24*3600*1000))});});});
      vj.sort((a,b)=>a.over-b.over);return JSON.stringify(vj.length?vj:`Geen verjaardagen de komende ${weken} weken.`);
    }
    case 'get_transport':{
      if(input.week){const dates=_hGetWeekDates(0);return JSON.stringify(dates.map(d=>({datum:fDateISO(d),dag:DLANG_GD[d.getDay()],transport:_hTransportVoorDag(fDateISO(d))})));}
      const datum=input.datum||_hNuISO();return JSON.stringify({datum,dag:DLANG_GD[new Date(datum+'T12:00:00').getDay()],transport:_hTransportVoorDag(datum)});
    }
    case 'get_schoolvakanties':return JSON.stringify({vakanties:SCHOOLVAKANTIES,uitzonderingen:(uitzonderingen||[]).filter(u=>u.datum>=_hNuISO())});
    case 'get_eethistoriek':{
      const weken=input.weken||8;const vandaagISO=_hNuISO();const nu=new Date(vandaagISO+'T12:00:00');const van=new Date(nu);van.setDate(van.getDate()-weken*7);const vanISO=fDateISO(van);
      const hist=[];Object.entries(planning).forEach(([datum,dag])=>{if(datum>=vanISO&&datum<vandaagISO){const e={datum};if(dag.ontbijt)e.ontbijt=_hGetNaam(dag.ontbijt);if(dag.lunch)e.lunch=_hGetNaam(dag.lunch);if(dag.avond)e.avond=_hGetNaam(dag.avond);if(e.ontbijt||e.lunch||e.avond)hist.push(e);}});
      hist.sort((a,b)=>b.datum.localeCompare(a.datum));return JSON.stringify(hist.length?hist:'Geen eethistoriek.');
    }
    case 'get_weer':{
      try{const coords=(typeof Maps!=='undefined'&&Maps.getCoords())||{lat:50.97,lng:3.19};const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${coords.lat}&longitude=${coords.lng}&current=temperature_2m,precipitation_probability,weather_code&timezone=Europe%2FBrussels`);const d=await r.json();const c=d.current.weather_code||0;const icons=[['☀️',0],['⛅',2],['☁️',3],['🌫️',49],['🌧️',69],['🌨️',79],['🌦️',82],['❄️',86],['⛈️',99]];const icon=(icons.find(([,t])=>c<=t)||['🌡️'])[0];return JSON.stringify({temp:Math.round(d.current.temperature_2m),regen:d.current.precipitation_probability,icon});}catch(e){return'Weersdata niet beschikbaar.';}
    }
    case 'get_conflicten':{
      const dates=_hGetWeekDates(input.offset||0);const conflicten=[];const personen=PERSONEN.length?PERSONEN:['jeroen','kelly','nora','odiel'];
      dates.forEach(d=>{const datum=fDateISO(d);const acts=activiteiten.filter(a=>isActiefOpDatum(a,datum)&&!a.informatief&&a.start&&a.eindUur);personen.forEach(persoon=>{const pA=acts.filter(a=>(a.wie||[]).includes(persoon));for(let i=0;i<pA.length;i++)for(let j=i+1;j<pA.length;j++){const a1=pA[i],a2=pA[j];if(a1.start<a2.eindUur&&a2.start<a1.eindUur)conflicten.push({datum,dag:DLANG_GD[d.getDay()],persoon:PLABEL[persoon]||persoon,act1:a1.naam,act2:a2.naam});}});});
      return JSON.stringify(conflicten.length?conflicten:'Geen conflicten gevonden.');
    }
    case 'zoek_ingredienten':{const q=(input.zoekterm||'').toLowerCase();return JSON.stringify(standaardIngredienten.filter(i=>(i.naam||'').toLowerCase().includes(q)).map(i=>({naam:i.naam,winkel:i.winkel,eenheid:i.eenheid||''})));}
    case 'stel_weekmenu_in':{
      if(!input.menu||!Array.isArray(input.menu))return'Fout formaat.';
      input.menu.forEach(dd=>{const key=dd.datum;if(!key||!/^\d{4}-\d{2}-\d{2}$/.test(key))return;if(!planning[key])planning[key]={};['ontbijt','lunch','avond'].forEach(slot=>{if(dd[slot]===undefined)return;let val=dd[slot];if(val===null||val==='')val=null;else if(typeof val==='string'&&_hSPEC[val])val=val;else if(typeof val==='number'||!isNaN(Number(val)))val=Number(val);else{const rec=recepten.find(r=>r.naam.toLowerCase()===String(val).toLowerCase());val=rec?rec.id:val;}planning[key][slot]=val;sbSavePlanning(key,slot,val,planning[key].porties||{});});});
      slaLokaalOp();return'✅ Weekmenu ingesteld.';
    }
    case 'wis_weekmenu_slot':{if(!planning[input.datum])planning[input.datum]={};planning[input.datum][input.slot]=null;sbSavePlanning(input.datum,input.slot,null,planning[input.datum].porties||{});slaLokaalOp();return`✅ ${input.slot} op ${input.datum} gewist.`;}
    case 'voeg_activiteit_toe':{const act={id:Date.now(),naam:input.naam,wie:input.wie||[],dagen:input.dagen||[],start:input.start||null,eindUur:input.eind_uur||null,duur:0,reisHeen:0,reisTerug:0,prep:input.prep||0,locatie:input.locatie||'',freq:input.freq||'wekelijks',beginDatum:input.begin_datum||null,eindDatum:input.eind_datum||null,meerdaags:false,prive:false,informatief:input.informatief||false,transport:{},maaltijdThuis:{}};activiteiten.push(act);slaLokaalOp();sbSaveActiviteit(act);return`✅ Activiteit "${act.naam}" toegevoegd.`;}
    case 'wijzig_activiteit':{const act=activiteiten.find(a=>a.naam.toLowerCase().includes(input.naam.toLowerCase()));if(!act)return`Activiteit "${input.naam}" niet gevonden.`;if(input.nieuw_naam!==undefined)act.naam=input.nieuw_naam;if(input.wie!==undefined)act.wie=input.wie;if(input.dagen!==undefined)act.dagen=input.dagen;if(input.start!==undefined)act.start=input.start;if(input.eind_uur!==undefined)act.eindUur=input.eind_uur;if(input.locatie!==undefined)act.locatie=input.locatie;if(input.freq!==undefined)act.freq=input.freq;if(input.begin_datum!==undefined)act.beginDatum=input.begin_datum;if(input.eind_datum!==undefined)act.eindDatum=input.eind_datum;if(input.prep!==undefined)act.prep=input.prep;slaLokaalOp();sbSaveActiviteit(act);return`✅ Activiteit "${act.naam}" gewijzigd.`;}
    case 'verwijder_activiteit':{const idx=activiteiten.findIndex(a=>a.naam.toLowerCase().includes(input.naam.toLowerCase()));if(idx<0)return`Activiteit "${input.naam}" niet gevonden.`;const[rm]=activiteiten.splice(idx,1);slaLokaalOp();if(rm._sbId)sbDeleteActiviteit(rm._sbId);return`✅ Activiteit "${rm.naam}" verwijderd.`;}
    case 'voeg_todo_toe':{const t={id:String(Date.now()),titel:input.titel,notitie:input.notitie||'',deadline:input.deadline||'',prioriteit:input.prioriteit||'middel',wie:input.wie||[],gedaan:false,aangemaaktDoor:Auth.profiel()?.persoonKey,aangemaaktOp:_hNuISO()};todos.push(t);slaLokaalOp();sbSaveTodo(t);renderTodosPreview(Auth.profiel());return`✅ To-do "${t.titel}" toegevoegd.`;}
    case 'wijzig_todo':{const t=todos.find(t=>t.id===input.id);if(!t)return'To-do niet gevonden.';if(input.titel!==undefined)t.titel=input.titel;if(input.notitie!==undefined)t.notitie=input.notitie;if(input.deadline!==undefined)t.deadline=input.deadline;if(input.prioriteit!==undefined)t.prioriteit=input.prioriteit;if(input.wie!==undefined)t.wie=input.wie;slaLokaalOp();sbSaveTodo(t);return`✅ To-do "${t.titel}" gewijzigd.`;}
    case 'vink_todo_af':{const t=todos.find(t=>t.id===input.id);if(!t)return'To-do niet gevonden.';t.gedaan=true;t.gedaanOp=_hNuISO();slaLokaalOp();sbSaveTodo(t);renderTodosPreview(Auth.profiel());return`✅ "${t.titel}" afgevinkt.`;}
    case 'verwijder_todo':{const idx=todos.findIndex(t=>t.id===input.id);if(idx<0)return'To-do niet gevonden.';const[rm]=todos.splice(idx,1);slaLokaalOp();if(rm._sbId)sbDeleteTodo(rm._sbId);return`✅ To-do "${rm.titel}" verwijderd.`;}
    case 'stel_transport_in':{if(!transportUitzonderingen[input.datum])transportUitzonderingen[input.datum]={};if(!transportUitzonderingen[input.datum][input.kind])transportUitzonderingen[input.datum][input.kind]={};const t=transportUitzonderingen[input.datum][input.kind];if(input.brengt!==undefined)t.brengt=input.brengt;if(input.haalt!==undefined)t.haalt=input.haalt;if(input.eet_groo!==undefined)t.eetGroo=input.eet_groo;slaLokaalOp();sbSaveInstellingen();maakTransportActiviteit(input.datum,input.kind,t.brengt,t.haalt);return`✅ Transport ${input.kind} op ${input.datum} ingesteld.`;}
    case 'wijzig_standaard_transport':{if(!standaardTransport[input.kind])standaardTransport[input.kind]={};if(!standaardTransport[input.kind][input.dag])standaardTransport[input.kind][input.dag]={};const t=standaardTransport[input.kind][input.dag];if(input.brengt!==undefined)t.brengt=input.brengt;if(input.haalt!==undefined)t.haalt=input.haalt;if(input.eet_groo!==undefined)t.eetGroo=input.eet_groo;slaLokaalOp();sbSaveInstellingen();return`✅ Standaard transport ${input.kind} op ${input.dag} gewijzigd.`;}
    case 'overschrijf_drukte':{drukteOverride[input.datum]=input.drukte;slaLokaalOp();sbSaveDrukte(input.datum,input.drukte);return`✅ Drukte op ${input.datum} = "${input.drukte}".`;}
    case 'voeg_aan_boodschappenlijst_toe':{const item={id:Date.now(),naam:input.naam,winkel:input.winkel||'Andere',hoev:input.hoev||'',eenheid:input.eenheid||''};extraItems.push(item);slaLokaalOp();sbSaveExtra(item);return`✅ "${input.naam}" toegevoegd aan boodschappenlijst.`;}
    case 'voeg_ingredient_toe':{const ing={id:String(Date.now()),naam:input.naam,winkel:input.winkel||'Andere',eenheid:input.eenheid||'',categorie:input.categorie||''};standaardIngredienten.push(ing);slaLokaalOp();sbSaveIngredient(ing);return`✅ Ingrediënt "${input.naam}" toegevoegd.`;}
    case 'voeg_recept_toe':{const rec={id:Date.now(),naam:input.naam,types:input.types||['avond'],type:input.types?.[0]||'avond',porties:input.porties||4,tijd:input.tijd||null,moeilijk:input.moeilijk||'Normaal',wie:input.wie?[input.wie]:null,bron:input.bron||'',bereiding:input.bereiding||'',tags:input.tags||[],score:input.score??null,prive:false,ingredienten:input.ingredienten||[]};recepten.push(rec);slaLokaalOp();const _r=await sbSaveRecept(rec);return _r===true?`✅ Recept "${rec.naam}" opgeslagen.`:`❌ Opslaan mislukt: ${_r}`;}
    case 'wijzig_recept':{const rec=recepten.find(r=>r.naam.toLowerCase().includes(input.naam.toLowerCase()));if(!rec)return`Recept "${input.naam}" niet gevonden.`;if(input.nieuw_naam!==undefined)rec.naam=input.nieuw_naam;if(input.types!==undefined){rec.types=input.types;rec.type=input.types[0];}if(input.tijd!==undefined)rec.tijd=input.tijd;if(input.moeilijk!==undefined)rec.moeilijk=input.moeilijk;if(input.wie!==undefined)rec.wie=[input.wie];if(input.bron!==undefined)rec.bron=input.bron;if(input.bereiding!==undefined)rec.bereiding=input.bereiding;if(input.score!==undefined)rec.score=input.score;if(input.tags!==undefined)rec.tags=input.tags;if(input.ingredienten!==undefined)rec.ingredienten=input.ingredienten;slaLokaalOp();const _r2=await sbSaveRecept(rec);return _r2===true?`✅ Recept "${rec.naam}" gewijzigd.`:`❌ Opslaan mislukt: ${_r2}`;}
    case 'onthoud': {
      const item = {tekst: input.tekst, aangemaakt_op: new Date().toISOString()};
      geheugen.push(item);
      slaLokaalOp();
      sbSaveGeheugen();
      return `✅ Onthouden: "${input.tekst}"`;
    }
    case 'vergeet_herinnering': {
      if (input.index < 0 || input.index >= geheugen.length) return `⚠️ Geen herinnering op index ${input.index}.`;
      const verwijderd = geheugen.splice(input.index, 1)[0];
      slaLokaalOp();
      sbSaveGeheugen();
      return `✅ Vergeten: "${verwijderd.tekst}"`;
    }
    default:return`Onbekende tool: ${naam}`;
  }
}

// ── Buienradar / Weer (Open-Meteo) ────────────────────────────
async function laadWeer(){
  try{
    const stored = JSON.parse(localStorage.getItem('gezinsapp_thuisadres_coords')||'null');
    const coords = stored || {lat:50.97,lng:3.19};
    let buienUrl='https://www.buienradar.be';
    try{ const _u=new URL(localStorage.getItem('gezinsapp_buienradar_url')||''); if(_u.protocol==='https:') buienUrl=_u.href; }catch{}
    const wLink=document.getElementById('weer-widget');
    if(wLink){ wLink.href=buienUrl; wLink.onclick=function(e){e.preventDefault();window.open(buienUrl,'_blank','noopener');}; }
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${coords.lat}&longitude=${coords.lng}&current=temperature_2m,weather_code&timezone=Europe%2FBrussels`);
    const d=await r.json();
    if(d.error) throw new Error(d.reason||'API fout');
    const temp=Math.round(d.current.temperature_2m);
    const code=d.current.weather_code??0;
    document.getElementById('weer-icon').textContent=weerIcon(code);
    document.getElementById('weer-temp').textContent=temp+'°C';
  }catch(e){ console.warn('[Weer]',e); document.getElementById('weer-temp').textContent='—'; }
}
function weerIcon(code){
  if(code===0)return'☀️';
  if(code<=2)return'⛅';
  if(code<=3)return'☁️';
  if(code<=67)return'🌧️';
  if(code<=77)return'🌨️';
  if(code<=82)return'🌦️';
  if(code<=99)return'⛈️';
  return'🌤️';
}
laadWeer();

// iOS keyboard fix: scroll chat-input in beeld wanneer toetsenbord opent
(function(){
  const inp = document.getElementById('home-chat-input-desktop');
  if (inp) inp.addEventListener('focus', () => {
    setTimeout(() => inp.scrollIntoView({ behavior: 'smooth', block: 'center' }), 350);
  });
  if (window.visualViewport) {
    const _setVVH = () => document.documentElement.style.setProperty('--vvh', window.visualViewport.height + 'px');
    window.visualViewport.addEventListener('resize', _setVVH);
    _setVVH();
  }
})();

document.addEventListener('DOMContentLoaded', function(){
  // ── Sluitknop injecteren in alle modals ──────────────────────
  document.querySelectorAll('.modal-bg .modal').forEach(modal => {
    if(modal.querySelector('.modal-sluit-btn')) return;
    const bg = modal.closest('.modal-bg');
    const btn = document.createElement('button');
    btn.className = 'modal-sluit-btn';
    btn.setAttribute('aria-label', 'Sluiten');
    btn.textContent = '✕';
    btn.onclick = function(e){
      e.stopPropagation();
      if(bg) bg.classList.remove('open');
    };
    modal.insertBefore(btn, modal.firstChild);
  });
});
