<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://ceeplmghvcaqvlpicwyi.supabase.co https://api.anthropic.com https://corsproxy.io https://nominatim.openstreetmap.org https://maps.googleapis.com; img-src 'self' data: https://maps.gstatic.com https://maps.googleapis.com; frame-src 'none'; object-src 'none';">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gezinsapp">
<meta name="theme-color" content="#FAFEF9">
<title>Gezinsapp — Home</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-title"><i data-lucide="home" class="icon-inline"></i> Gezinsapp</div>
  <div class="topbar-actions">
    <span class="opslag-status" id="opslag-status"></span>
    <span id="dev-badge" class="dev-badge">🔧 dev</span>
    <div class="topbar-user-wrap">
      <div class="topbar-user" id="topbar-user" data-action="toggle-profiel-menu">
        <span class="avatar" id="topbar-emoji">🧑</span>
        <span class="naam" id="topbar-naam">…</span>
      </div>
      <div class="profiel-menu" id="profiel-menu">
        <a href="instellingen.html" class="profiel-menu-item"><i data-lucide="settings" class="icon-inline"></i>&nbsp; Instellingen</a>
      </div>
    </div>
  </div>
</header>

<script src="nav.js"></script>
<main class="main-content">
<div class="page-content">

  <!-- Compacte begroeting -->
  <div class="dag-overzicht-compact">
    <div class="dag-overzicht-links">
      <div class="dag-overzicht-datum" id="dag-datum"></div>
      <div class="dag-overzicht-titel" id="dag-begroeting">Laden…</div>
    </div>
    <div class="dag-compact-rechts" style="display:flex;align-items:center;gap:12px;flex-shrink:0;">
      <a id="weer-widget" class="weer-widget-link" href="https://www.buienradar.be" target="_blank" rel="noopener" title="Weer — Buienradar">
        <span id="weer-icon"><i data-lucide="sun" style="width:16px;height:16px;display:inline-block;vertical-align:-0.15em;"></i></span>
        <span id="weer-temp">…</span>
        <span class="weer-widget-regen" id="weer-regen"></span>
      </a>
      <div class="dag-overzicht-drukte" id="dag-drukte">
        <span id="dag-drukte-dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--rustig-dot);vertical-align:middle;"></span>&nbsp;<span id="dag-drukte-label">…</span>
      </div>
    </div>
  </div>

  <!-- Agent — hoofdfocus -->
  <div class="home-agent-panel">
    <div class="home-agent-header">
      <span class="home-agent-titel"><i data-lucide="bot" class="icon-inline"></i> Gezinsassistent</span>
      <div style="display:flex;gap:8px;align-items:center;">
        <div class="home-agent-snelvragen" style="padding:0;">
          <button class="voorbeeld-btn" data-action="stuur-voorbeeld-home" data-tekst="Wat staat er vandaag op de planning?"><i data-lucide="calendar" class="icon-inline"></i> Vandaag</button>
          <button class="voorbeeld-btn" data-action="stuur-voorbeeld-home" data-tekst="Maak een weekmenu voor deze week."><i data-lucide="utensils" class="icon-inline"></i> Weekmenu</button>
          <button class="voorbeeld-btn" data-action="stuur-voorbeeld-home" data-tekst="Wat staat er open op de to-do lijst?"><i data-lucide="list-todo" class="icon-inline"></i> To-do's</button>
          <button class="voorbeeld-btn" data-action="stuur-voorbeeld-home" data-tekst="Genereer boodschappenlijst op basis van weekmenu."><i data-lucide="shopping-cart" class="icon-inline"></i> Boodschappen</button>
        </div>
        <button data-action="home-wis-chat" title="Wis chat" class="icon-btn"><i data-lucide="trash-2" style="width:16px;height:16px;"></i></button>
      </div>
    </div>
    <div class="home-chat-berichten" id="home-chat-berichten-desktop">
      <div style="align-self:flex-start;" id="home-chat-welkom"></div>
    </div>
    <div id="home-bevestiging-desktop" class="home-bevestiging-panel" style="display:none;">
      <div class="home-bevestiging-titel"><i data-lucide="hand" class="icon-inline"></i> Bevestiging vereist</div>
      <div id="home-bevestiging-tekst-desktop" class="home-bevestiging-tekst"></div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-primary btn-sm" data-action="home-bevestig"><i data-lucide="check" class="icon-inline"></i> Ja</button>
        <button class="btn btn-secondary btn-sm" data-action="home-annuleer"><i data-lucide="x" class="icon-inline"></i> Nee</button>
      </div>
    </div>
    <div class="home-chat-input-row">
      <input type="text" id="home-chat-input-desktop" placeholder="Stel een vraag of geef een opdracht…"/>
      <button class="btn btn-primary btn-sm" data-action="home-stuur" style="flex-shrink:0;">→</button>
    </div>
  </div>

  <!-- Secundaire content -->
  <div class="section-label">Bekijk als</div>
  <div class="avatar-strip" id="persoon-strip"></div>

  <div class="section-label">Snel toevoegen</div>
  <div class="snelle-actie-grid">
    <button class="snelle-actie-btn" data-action="navigeer" data-href="todos.html?nieuw=1&van=home">
      <span class="snelle-actie-icon"><i data-lucide="list-todo" style="width:22px;height:22px;"></i></span><span class="snelle-actie-label">To-do toevoegen</span>
    </button>
    <button class="snelle-actie-btn" data-action="navigeer" data-href="agenda.html?nieuw=1&van=home">
      <span class="snelle-actie-icon"><i data-lucide="calendar-plus" style="width:22px;height:22px;"></i></span><span class="snelle-actie-label">Activiteit toevoegen</span>
    </button>
    <button class="snelle-actie-btn" data-action="navigeer" data-href="weekplanner.html">
      <span class="snelle-actie-icon"><i data-lucide="utensils" style="width:22px;height:22px;"></i></span><span class="snelle-actie-label">Weekmenu bekijken</span>
    </button>
    <button class="snelle-actie-btn" data-action="navigeer" data-href="boodschappen.html">
      <span class="snelle-actie-icon"><i data-lucide="shopping-cart" style="width:22px;height:22px;"></i></span><span class="snelle-actie-label">Boodschappen</span>
    </button>
  </div>

  <div id="verjaardag-home"></div>

  <div class="section-label">Vandaag</div>
  <div id="vandaag-lijst"><div class="spinner"></div></div>

  <div class="section-label">Openstaande to-do's</div>
  <div id="todos-preview"><div class="spinner"></div></div>
</div>
</main>

<!-- Activiteit detail modal -->
<div id="act-detail-bg" class="modal-bg">
  <div class="modal">
    <div class="modal-handle"></div>
    <div id="act-detail-inhoud"></div>
    <div class="modal-actions">
      <button class="modal-btn modal-btn-cancel" data-action="sluit-act-detail">Sluiten</button>
      <button class="modal-btn modal-btn-primary" id="act-detail-agenda-btn">Naar agenda →</button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="auth.js"></script>
<script src="state.js"></script>
<script src="data.js"></script>
<script src="agent.js"></script>
<script src="agent-tools.js"></script>
<script src="home.js"></script>
</body>
</html>
