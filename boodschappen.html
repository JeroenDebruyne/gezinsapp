<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://maps.googleapis.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://ceeplmghvcaqvlpicwyi.supabase.co https://nominatim.openstreetmap.org https://maps.googleapis.com; img-src 'self' data: https://maps.gstatic.com https://maps.googleapis.com; frame-src 'none'; object-src 'none';">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FAF9F7">
<title>Gezinsapp — Boodschappen</title>
<link rel="stylesheet" href="style.css">
<style>
.voortgang-wrap-tekst{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--ink-2);font-weight:500;margin-bottom:4px;}
.boodschap-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer;}
.boodschap-cirkel{width:24px;height:24px;border-radius:50%;border:2px solid var(--border-2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;}
.boodschap-cirkel.gedaan{background:var(--rustig-dot);border-color:var(--rustig-dot);}
.boodschap-cirkel.gedaan::after{content:'✓';color:#fff;font-size:13px;font-weight:700;}
.ing-combo-wrap{position:relative;}
.ing-combo-input{width:100%;padding:10px 13px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:15px;font-family:inherit;background:var(--surface);color:var(--ink);outline:none;box-sizing:border-box;}
.ing-combo-input:focus{border-color:var(--accent);}
.ing-combo-dropdown{display:none;position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1.5px solid var(--accent);border-top:none;border-radius:0 0 var(--radius-sm) var(--radius-sm);z-index:50;max-height:200px;overflow-y:auto;box-shadow:var(--shadow);}
.ing-combo-dropdown.open{display:block;}
.ing-combo-option{padding:10px 13px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;}
.ing-combo-option:hover{background:var(--accent-l);}
.ing-combo-option .winkel-hint{font-size:11px;color:var(--muted);}
.ing-combo-nieuw{padding:10px 13px;font-size:14px;cursor:pointer;color:var(--accent);font-weight:600;border-top:1px solid var(--border);}
.ing-combo-nieuw:hover{background:var(--accent-l);}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-title"><i data-lucide="shopping-cart" class="icon-inline"></i> Boodschappen</div>
  <div class="topbar-actions">
    <span class="opslag-status" id="opslag-status"></span>
    <span id="dev-badge" style="display:none;font-size:10px;background:var(--c-odiel);color:var(--c-odiel-t);padding:2px 8px;border-radius:99px;font-weight:600;">🔧 dev</span>
    <div class="topbar-user-wrap">
      <div class="topbar-user" id="topbar-user" data-action="toggle-profiel-menu">
        <span class="avatar" id="topbar-emoji">🧑</span>
        <span class="naam" id="topbar-naam">…</span>
      </div>
      <div class="profiel-menu" id="profiel-menu">
        <a href="instellingen.html" class="profiel-menu-item"><i data-lucide="settings" class="icon-inline"></i>&nbsp; Instellingen</a>
      </div>
    </div>
  </div>
</header>
<script src="nav.js"></script>
<main class="main-content">
<div class="page-content">
  <select class="mob-filter-sel" id="winkel-sel-mob"></select>
  <div class="pill-tabs mob-hide-on-mobile" id="winkel-tabs"></div>

  <!-- Extra item toevoegen -->
  <div style="display:flex;gap:6px;margin-bottom:1rem;align-items:center;">
    <div style="flex:1;min-width:0;">
      <div class="ing-combo-wrap">
        <input class="ing-combo-input" id="bood-combo-input" type="text"
          placeholder="Ingrediënt zoeken of toevoegen…"
          autocomplete="off"/>
        <div class="ing-combo-dropdown" id="bood-combo-dd"></div>
      </div>
    </div>
    <select id="bood-winkel-sel" style="padding:8px 6px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;background:var(--surface);color:var(--ink);flex-shrink:0;max-width:100px;"></select>
    <button class="btn btn-primary btn-sm" data-action="voeg-extra-toe">+ Voeg toe</button>
  </div>

  <!-- Voortgang -->
  <div id="voortgang-wrap" style="display:none;">
    <div class="voortgang-wrap-tekst">
      <span id="voortgang-tekst"></span>
      <div style="display:flex;gap:10px;align-items:center;">
        <button id="btn-verwijder-afgevinkt" data-action="verwijder-afgevinkt" style="display:none;background:none;border:none;font-size:13px;color:var(--druk-clr);cursor:pointer;font-family:inherit;align-items:center;gap:4px;"><i data-lucide="trash-2" class="icon-inline"></i> Verwijder afgevinkte</button>
        <button data-action="reset-afgevinkt" style="background:none;border:none;font-size:13px;color:var(--muted);cursor:pointer;font-family:inherit;">↺ Reset</button>
      </div>
    </div>
  </div>

  <!-- Boodschappenlijst -->
  <div id="boodschappen-inhoud"></div>
  <div class="section-label" id="extra-items-label">Extra items</div>
  <div id="extra-items-lijst"></div>
</div>
</main>

<script src="config.js"></script>
<script src="auth.js"></script>
<script src="state.js"></script>
<script src="data.js"></script>
<script src="boodschappen.js"></script>
</body>
</html>
