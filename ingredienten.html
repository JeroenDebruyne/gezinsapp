<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FAFEF9">
<title>Gezinsapp — Ingrediënten</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-title">🌿 Ingrediënten</div>
  <div class="topbar-actions">
    <span class="opslag-status" id="opslag-status"></span>
    <span id="dev-badge" style="display:none;font-size:10px;background:var(--c-odiel);color:var(--c-odiel-t);padding:2px 8px;border-radius:99px;font-weight:600;">🔧 dev</span>
    <div class="topbar-user-wrap">
      <div class="topbar-user" id="topbar-user" data-action="toggle-profiel-menu">
        <span class="avatar" id="topbar-emoji">🧑</span>
        <span class="naam" id="topbar-naam">…</span>
      </div>
      <div class="profiel-menu" id="profiel-menu">
        <a href="instellingen.html" class="profiel-menu-item"><i data-lucide="settings" class="icon-inline"></i>&nbsp; Instellingen</a>
      </div>
    </div>
  </div>
</header>
<script src="nav.js"></script>

<main class="main-content">
<div class="page-content">
  <div class="page-header">
    <div style="display:flex;gap:8px;align-items:center;flex:1;">
      <input type="text" id="ing-search" placeholder="🔍 Zoek ingrediënt…"
        style="flex:1;padding:10px 13px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:15px;font-family:inherit;background:var(--surface);color:var(--ink);outline:none;"/>
      <button class="btn btn-primary" data-action="open-ing-modal">+ Toevoegen</button>
    </div>
  </div>

  <select class="mob-filter-sel" id="ing-winkel-sel-mob" data-action="filter-ing-winkel-mob"></select>
  <div class="pill-tabs mob-hide-on-mobile" id="ing-winkel-filter" style="margin-bottom:12px;"></div>
  <div id="ingredienten-lijst"></div>
</div>
</main>

<!-- Modal: Ingrediënt -->
<div class="modal-bg" id="ing-modal-bg">
<div class="modal" style="max-width:420px;">
  <div class="modal-handle"></div>
  <h3 id="ing-modal-titel">Ingrediënt toevoegen</h3>
  <div class="form-row">
    <label>Naam</label>
    <input type="text" id="i-naam" placeholder="bijv. gehakt"/>
  </div>
  <div class="form-row">
    <label>Standaard winkel</label>
    <select id="i-winkel"></select>
  </div>
  <div class="form-row">
    <label>Productlink <span style="font-size:11px;font-weight:400;color:var(--muted);">(optioneel)</span></label>
    <input type="url" id="i-link" placeholder="https://www.colruyt.be/…" style="font-size:13px;"/>
  </div>
  <div class="modal-actions">
    <button class="modal-btn modal-btn-cancel" data-action="close-ing-modal">Annuleren</button>
    <button class="modal-btn modal-btn-primary" data-action="save-ingredient">Opslaan</button>
  </div>
</div>
</div>

<script src="config.js"></script>
<script src="auth.js"></script>
<script src="data.js"></script>
<script src="ingredienten.js"></script>
</body>
</html>
