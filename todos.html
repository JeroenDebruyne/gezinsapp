<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://ceeplmghvcaqvlpicwyi.supabase.co https://nominatim.openstreetmap.org https://maps.googleapis.com; img-src 'self' data: https://maps.gstatic.com https://maps.googleapis.com; frame-src 'none'; object-src 'none';">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gezinsapp">
<meta name="theme-color" content="#FAFEF9">
<title>Gezinsapp — To-do's</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ── Topbar ─────────────────────────────────────────────── -->
<header class="topbar">
  <div class="topbar-title"><i data-lucide="list-todo" class="icon-inline"></i> To-do's</div>
  <div class="topbar-actions">
    <span class="opslag-status" id="opslag-status"></span>
    <span id="dev-badge" class="dev-badge">🔧 dev</span>
    <div class="topbar-user-wrap">
      <div class="topbar-user" id="topbar-user" data-action="toggle-profiel-menu">
        <span class="avatar" id="topbar-emoji">🧑</span>
        <span class="naam" id="topbar-naam">…</span>
      </div>
      <div class="profiel-menu" id="profiel-menu">
        <a href="instellingen.html" class="profiel-menu-item"><i data-lucide="settings" class="icon-inline"></i>&nbsp; Instellingen</a>
      </div>
    </div>
  </div>
</header>

<script src="nav.js"></script>
<main class="main-content">

  <!-- Filter tabs -->
  <select class="mob-filter-sel" id="filter-sel-mob">
    <option value="mijn">Mijn to-do's</option>
    <option value="vandaag">Vandaag</option>
    <option value="alle">Alle to-do's</option>
  </select>
  <div class="filter-tabs" id="filter-tabs">
    <button class="filter-tab active" data-filter="mijn" data-action="filter-tab">Mijn to-do's <span class="filter-tab-badge" id="badge-mijn"></span></button>
    <button class="filter-tab" data-filter="vandaag" data-action="filter-tab">Vandaag <span class="filter-tab-badge" id="badge-vandaag"></span></button>
    <button class="filter-tab" data-filter="alle" data-action="filter-tab">Alle to-do's <span class="filter-tab-badge" id="badge-alle"></span></button>
  </div>

  <!-- Lijst -->
  <div class="todo-lijst" id="todo-lijst"></div>

</main>

<!-- FAB -->
<button class="fab" data-action="open-modal" title="To-do toevoegen">＋</button>

<!-- ══ MODAL: To-do toevoegen/bewerken ══ -->
<div class="modal-bg" id="todo-modal-bg">
<div class="modal">
  <div class="modal-handle"></div>
  <h3 id="modal-titel">Nieuwe to-do</h3>

  <div class="form-row">
    <label>Wat moet er gedaan worden?</label>
    <input type="text" id="t-titel" placeholder="Beschrijving van de to-do"/>
  </div>

  <div class="form-row">
    <label>Notitie (optioneel)</label>
    <textarea id="t-notitie" rows="2" placeholder="Extra details…"></textarea>
  </div>

  <div class="form-grid">
    <div class="form-row">
      <label>Deadline</label>
      <input type="date" id="t-deadline"/>
    </div>
    <div class="form-row">
      <label>Geschatte tijd</label>
      <select id="t-duur">
        <option value="">— geen —</option>
        <option value="5">5 min</option>
        <option value="15">15 min</option>
        <option value="30">30 min</option>
        <option value="60">1 uur</option>
        <option value="120">2 uur</option>
        <option value="240">4 uur</option>
        <option value="480">Hele dag</option>
      </select>
    </div>
  </div>

  <div class="form-row">
    <label>Prioriteit</label>
    <div class="prioriteit-keuze">
      <button class="prio-btn hoog" data-action="set-prio" data-prio="hoog"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--druk-dot);vertical-align:middle;margin-right:4px;"></span>Hoog</button>
      <button class="prio-btn middel selected" data-action="set-prio" data-prio="middel"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--normaal-dot);vertical-align:middle;margin-right:4px;"></span>Middel</button>
      <button class="prio-btn laag" data-action="set-prio" data-prio="laag"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--rustig-dot);vertical-align:middle;margin-right:4px;"></span>Laag</button>
    </div>
  </div>

  <div class="form-row">
    <label>Voor wie</label>
    <div class="persoon-ms" id="t-wie-ms"></div>
  </div>

  <div class="prive-toggle" data-action="toggle-prive">
    <div class="prive-toggle-left">
      <span class="prive-toggle-label"><i data-lucide="lock" class="icon-inline"></i> Privé</span>
      <span class="prive-toggle-sub">Alleen voor jezelf zichtbaar</span>
    </div>
    <div class="ios-switch" id="prive-switch"></div>
  </div>

  <div class="modal-actions" id="modal-actions">
    <button class="modal-btn modal-btn-cancel" data-action="close-modal">Annuleren</button>
    <button class="modal-btn modal-btn-primary" data-action="save-todo">Opslaan</button>
  </div>
</div>
</div>

<script src="config.js"></script>
<script src="auth.js"></script>
<script src="state.js"></script>
<script src="data.js"></script>
<script src="todos.js"></script>
</body>
</html>
