<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FAFEF9">
<title>Gezinsapp — Contacten</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-title"><i data-lucide="users" class="icon-inline"></i> Contacten</div>
  <div class="topbar-actions">
    <span class="opslag-status" id="opslag-status"></span>
    <span id="dev-badge" style="display:none;font-size:10px;background:var(--c-odiel);color:var(--c-odiel-t);padding:2px 8px;border-radius:99px;font-weight:600;">🔧 dev</span>
    <div class="topbar-user-wrap">
      <div class="topbar-user" id="topbar-user" data-action="toggle-profiel-menu">
        <span class="avatar" id="topbar-emoji">🧑</span>
        <span class="naam" id="topbar-naam">…</span>
      </div>
      <div class="profiel-menu" id="profiel-menu">
        <a href="instellingen.html" class="profiel-menu-item"><i data-lucide="settings" class="icon-inline"></i>&nbsp; Instellingen</a>
      </div>
    </div>
  </div>
</header>
<button class="fab" data-action="open-crm-modal" title="Contact toevoegen">＋</button>
<script src="nav.js"></script>
<main class="main-content">
<div class="crm-layout">
  <!-- Linker kolom: lijst + zoek -->
  <div class="crm-kolom-lijst">
    <input type="text" id="crm-search" placeholder="🔍 Zoeken…" style="width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:15px;margin-bottom:1rem;background:var(--surface);color:var(--ink);outline:none;font-family:inherit;"/>
    <div id="verjaardag-alerts"></div>
    <div id="crm-lijst"></div>
  </div>
  <!-- Rechter kolom: contactfiche (alleen desktop) -->
  <div class="crm-kolom-detail" id="crm-kolom-detail">
    <div class="fiche-placeholder" id="crm-fiche-placeholder">
      <i data-lucide="users" style="width:48px;height:48px;display:block;color:var(--muted-2);stroke-width:1.5;margin:0 auto 8px;"></i>
      <p>Kies een contact uit de lijst</p>
    </div>
    <div id="crm-fiche" style="display:none;"></div>
  </div>
</div>
</main>

<!-- Mobile contactfiche overlay -->
<div class="recept-fiche-overlay" id="crm-fiche-overlay">
  <div class="recept-fiche-sheet">
    <div class="modal-handle"></div>
    <div id="crm-fiche-mobiel"></div>
  </div>
</div>

<!-- Modal -->
<div class="modal-bg" id="crm-modal-bg">
<div class="modal">
  <div class="modal-handle"></div>
  <h3 id="crm-modal-titel">Contact toevoegen</h3>

  <!-- Partner 1 -->
  <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;display:flex;align-items:center;gap:5px;"><i data-lucide="user" class="icon-inline"></i> Partner 1</div>
  <div class="form-grid" style="grid-template-columns:1fr 1fr;">
    <div class="form-row"><label>Voornaam</label><input type="text" id="c-p1-voornaam" placeholder="Voornaam"/></div>
    <div class="form-row"><label>Achternaam</label><input type="text" id="c-p1-achternaam" placeholder="Achternaam"/></div>
  </div>
  <div class="form-row"><label>Verjaardag</label><input type="date" id="c-p1-verjaardag"/></div>

  <!-- Partner 2 -->
  <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 8px;display:flex;align-items:center;gap:5px;"><i data-lucide="user" class="icon-inline"></i> Partner 2 <span style="font-weight:400;text-transform:none;">(optioneel)</span></div>
  <div class="form-grid" style="grid-template-columns:1fr 1fr;">
    <div class="form-row"><label>Voornaam</label><input type="text" id="c-p2-voornaam" placeholder="Voornaam"/></div>
    <div class="form-row"><label>Achternaam</label><input type="text" id="c-p2-achternaam" placeholder="Achternaam"/></div>
  </div>
  <div class="form-row"><label>Verjaardag</label><input type="date" id="c-p2-verjaardag"/></div>

  <!-- Kinderen -->
  <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 8px;display:flex;align-items:center;gap:5px;"><i data-lucide="baby" class="icon-inline"></i> Kinderen <span style="font-weight:400;text-transform:none;">(max. 5)</span></div>
  <div id="c-kinderen-rijen"></div>
  <button type="button" id="c-kind-add-btn" data-action="voeg-kind-toe"
    style="width:100%;padding:10px;border:1.5px dashed var(--border-2);border-radius:var(--radius-sm);background:none;color:var(--muted);font-size:13px;cursor:pointer;margin-bottom:14px;">
    + Kind toevoegen
  </button>

  <!-- Belangrijke datums -->
  <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 8px;display:flex;align-items:center;gap:5px;"><i data-lucide="calendar" class="icon-inline"></i> Belangrijke datums <span style="font-weight:400;text-transform:none;">(optioneel)</span></div>
  <div id="c-datums-rijen"></div>
  <button type="button" id="c-datum-add-btn" data-action="voeg-datum-toe"
    style="width:100%;padding:10px;border:1.5px dashed var(--border-2);border-radius:var(--radius-sm);background:none;color:var(--muted);font-size:13px;cursor:pointer;margin-bottom:14px;">
    + Datum toevoegen
  </button>

  <!-- Kerstkaart -->
  <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--surface-2);border:1.5px solid var(--border);border-radius:var(--radius-sm);margin-bottom:14px;cursor:pointer;" data-action="toggle-kerstkaart">
    <div>
      <div style="font-size:15px;font-weight:500;color:var(--ink);display:flex;align-items:center;gap:6px;"><i data-lucide="tree-pine" class="icon-inline"></i> Kerstkaart sturen</div>
    </div>
    <div class="ios-switch" id="c-kerstkaart-switch"></div>
  </div>

  <!-- Adres -->
  <div class="form-row">
    <label><i data-lucide="home" class="icon-inline"></i> Adres <span style="font-size:11px;font-weight:400;color:var(--muted);">(optioneel — voor reistijdberekening)</span></label>
    <input type="text" id="c-adres" placeholder="Straat, huisnr, gemeente"/>
  </div>

  <!-- Cadeaus -->
  <div class="form-row"><label><i data-lucide="party-popper" class="icon-inline"></i> Cadeau nieuwjaar</label><textarea id="c-cadeau-nj" rows="2" placeholder="Ideeën…"></textarea></div>
  <div class="form-row"><label><i data-lucide="cake" class="icon-inline"></i> Cadeau verjaardag</label><textarea id="c-cadeau-vj" rows="2" placeholder="Ideeën per persoon…"></textarea></div>

  <div class="modal-actions">
    <button class="modal-btn modal-btn-cancel" data-action="close-crm-modal">Annuleren</button>
    <button class="modal-btn modal-btn-primary" data-action="save-contact">Opslaan</button>
  </div>
</div>
</div>

<script src="config.js"></script>
<script src="auth.js"></script>
<script src="data.js"></script>
<script src="maps.js"></script>
<script src="contacten.js"></script>
</body>
</html>
